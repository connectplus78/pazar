name: Piyasa Verilerini Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write # GitHub Actions'ın dosyaları değiştirebilmesi ve gönderebilmesi için kritik izin

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests

      - name: Botu Çalıştır
        run: python bot.py

      - name: Değişiklikleri GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add markets.json
          git commit -m "Otomatik piyasa verisi güncellendi" || echo "Değişiklik yok"
          git push
