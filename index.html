<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Plus - Canlı Piyasa Verileri</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff9800;
            margin-bottom: 5px;
        }
        .update-time {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, background-color 0.5s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #ff9800;
        }
        .symbol {
            font-size: 16px;
            color: #ffa726;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .price {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .change {
            font-size: 14px;
            font-weight: 600;
        }
        .positive {
            color: #3fb950;
        }
        .negative {
            color: #f85149;
        }
        /* Fiyat değişim animasyonları */
        @keyframes flash-green {
            0% { background-color: #238636; }
            100% { background-color: #161b22; }
        }
        @keyframes flash-red {
            0% { background-color: #da3633; }
            100% { background-color: #161b22; }
        }
        .flash-up {
            animation: flash-green 1s ease;
        }
        .flash-down {
            animation: flash-red 1s ease;
        }
    </style>
</head>
<body>

    <h1>Connect Plus Piyasa</h1>
    <div class="update-time" id="updateTime">Son Güncelleme: Yükleniyor...</div>

    <div class="grid-container" id="marketGrid">
        <!-- Kartlar dinamik olarak yüklenecek -->
    </div>

    <script>
        let previousPrices = {};

        function loadMarketData() {
            // Önbelleğe takılmaması için dinamik zaman damgası eklenmiştir
            fetch('markets.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('markets.json dosyasına ulaşılamadı');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('updateTime').innerText = "Son Güncelleme: " + (data.son_güncelleme || "Bilinmiyor");
                    
                    const grid = document.getElementById('marketGrid');
                    grid.innerHTML = "";

                    if (!data.items || data.items.length === 0) {
                        grid.innerHTML = "<div style='grid-column: 1/-1; text-align: center; color: #8b949e;'>Görüntülenecek veri bulunamadı.</div>";
                        return;
                    }

                    data.items.forEach(item => {
                        const changeStr = String(item.change || "");
                        const isPositive = !changeStr.includes("-");
                        const changeClass = isPositive ? "positive" : "negative";

                        let flashClass = "";
                        if (previousPrices[item.symbol] !== undefined) {
                            let currVal = parseFloat(String(item.price).replace(/\./g, '').replace(',', '.'));
                            let prevVal = parseFloat(String(previousPrices[item.symbol]).replace(/\./g, '').replace(',', '.'));
                            if (!isNaN(currVal) && !isNaN(prevVal)) {
                                if (currVal > prevVal) flashClass = "flash-up";
                                else if (currVal < prevVal) flashClass = "flash-down";
                            }
                        }
                        previousPrices[item.symbol] = item.price;

                        const card = document.createElement('div');
                        card.className = `card ${flashClass}`;
                        card.innerHTML = `
                            <div class="symbol">${item.symbol}</div>
                            <div class="price">${item.price}</div>
                            <div class="change ${changeClass}">${item.change}</div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(error => console.error('Veri yükleme hatası:', error));
        }

        // Sayfa açıldığında ilk yükleme
        loadMarketData();

        // Her 3 saniyede bir verileri tazeçe çek
        setInterval(loadMarketData, 3000);
    </script>

</body>
</html>
