<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Plus - Canlı Piyasa Verileri</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff9800;
            margin-bottom: 5px;
        }
        .update-time {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, background-color 0.5s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #ff9800;
        }
        .symbol {
            font-size: 16px;
            color: #ffa726;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .price {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .change {
            font-size: 14px;
            font-weight: 600;
        }
        .positive {
            color: #3fb950;
        }
        .negative {
            color: #f85149;
        }
        /* Flash animasyonları */
        @keyframes flash-green {
            0% { background-color: #238636; }
            100% { background-color: #161b22; }
        }
        @keyframes flash-red {
            0% { background-color: #da3633; }
            100% { background-color: #161b22; }
        }
        .flash-up {
            animation: flash-green 1s ease;
        }
        .flash-down {
            animation: flash-red 1s ease;
        }
    </style>
</head>
<body>

    <h1>Connect Plus Piyasa</h1>
    <div class="update-time" id="updateTime">Son Güncelleme: Yükleniyor...</div>

    <div class="grid-container" id="marketGrid">
        <!-- Kartlar dinamik olarak buraya yüklenecek -->
    </div>

    <script>
        // Eski verilerin önbelleğe takılmaması için hafızada tutulan nesne
        let previousPrices = {};

        function loadMarketData() {
            // ?t= timestamp ekleyerek tarayıcının dosyayı her seferinde taze çekmesi sağlanır
            fetch('markets.json?t=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Dosya okunamadı');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('updateTime').innerText = "Son Güncelleme: " + data.son_güncelleme;
                    
                    const grid = document.getElementById('marketGrid');
                    grid.innerHTML = ""; // Önceki içeriği temizle

                    data.items.forEach(item => {
                        const isPositive = item.change.includes("+");
                        const changeClass = isPositive ? "positive" : "negative";

                        // Fiyat değişim animasyonu kontrolü
                        let flashClass = "";
                        if (previousPrices[item.symbol] !== undefined) {
                            if (parseFloat(item.price.replace(/,/g, '')) > parseFloat(previousPrices[item.symbol].replace(/,/g, ''))) {
                                flashClass = "flash-up";
                            } else if (parseFloat(item.price.replace(/,/g, '')) < parseFloat(previousPrices[item.symbol].replace(/,/g, ''))) {
                                flashClass = "flash-down";
                            }
                        }
                        previousPrices[item.symbol] = item.price;

                        const card = document.createElement('div');
                        card.className = `card ${flashClass}`;
                        card.innerHTML = `
                            <div class="symbol">${item.symbol}</div>
                            <div class="price">${item.price}</div>
                            <div class="change ${changeClass}">${item.change}</div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(error => console.error('Hata oluştu:', error));
        }

        // Sayfa açıldığında ilk yüklemeyi yap
        loadMarketData();

        // Her 2 saniyede bir verileri tazele
        setInterval(loadMarketData, 2000);
    </script>

</body>
</html>
