<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Plus Piyasa</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b131e;
            --card-bg: #131f33;
            --card-hover: #1a2a44;
            --text-color: #ffffff;
            --title-color: #a0aec0;
            --border-color: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-hover: #e2e8f0;
            --text-color: #0f172a;
            --title-color: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-top: 20px;
            padding-bottom: 40px;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
        }
        .navbar-custom {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }
        .navbar-brand-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        @keyframes pulseDot {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .live-dot {
            width: 14px;
            height: 14px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulseDot 1.5s infinite;
        }

        .navbar-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 0;
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
            background-color: var(--card-hover);
        }
        .market-card {
            background-color: var(--card-bg);
            border: none;
            border-radius: 10px;
            text-align: center;
            padding: 1.5rem 0.5rem;
            height: 100%;
            transition: transform 0.2s, background-color 0.3s ease;
        }
        .market-card:hover {
            transform: translateY(-3px);
            background-color: var(--card-hover);
        }
        .market-title {
            color: var(--title-color);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }
        .market-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }
        .market-change {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .text-up {
            color: #22c55e !important;
        }
        .text-down {
            color: #ef4444 !important;
        }
        
        @keyframes flashGreen {
            0% { background-color: #166534; box-shadow: 0 0 20px #22c55e; }
            100% { background-color: var(--card-bg); box-shadow: none; }
        }
        .flash-green {
            animation: flashGreen 1.2s ease-out;
        }

        @keyframes flashRed {
            0% { background-color: #991b1b; box-shadow: 0 0 20px #ef4444; }
            100% { background-color: var(--card-bg); box-shadow: none; }
        }
        .flash-red {
            animation: flashRed 1.2s ease-out;
        }

        /* Alt Footer Alanı */
        .footer-custom {
            text-align: center;
            margin-top: 4rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--title-color);
            font-size: 0.9rem;
        }
        .footer-brand {
            color: #38bdf8;
            font-weight: 700;
            text-decoration: none;
        }
        .footer-update {
            margin-top: 0.3rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <!-- Üst Bar -->
        <div class="navbar-custom container">
            <div class="navbar-brand-wrapper">
                <div class="live-dot"></div>
                <h2 class="navbar-title">Connect Plus Piyasa</h2>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Tema Değiştir">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>

        <div class="container">
            <!-- Kartların Listeleneceği Alan -->
            <div id="marketsContainer" class="row g-3 justify-content-center">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-secondary" role="status">
                        <span class="visually-hidden">Yükleniyor...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alt Footer -->
    <div class="container">
        <footer class="footer-custom">
            <div>© <span id="currentYear">2026</span> <span class="footer-brand">Connect Plus</span> Özel Yayınıdır.</div>
            <div class="footer-update">Son Güncelleme: <span id="lastUpdateTime">Yükleniyor...</span></div>
        </footer>
    </div>

    <script>
        const jsonUrl = 'https://raw.githubusercontent.com/connectplus78/pazar/refs/heads/main/markets.json';
        let previousPrices = {};

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.getAttribute('data-theme') === 'light') {
                html.removeAttribute('data-theme');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'light');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }

            document.getElementById('currentYear').textContent = new Date().getFullYear();

            fetchMarkets();
            setInterval(fetchMarkets, 2000);
        });

        async function fetchMarkets() {
            try {
                const response = await fetch(jsonUrl + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Veri alınamadı.');
                
                const data = await response.json();
                
                // Bot tarafından gönderilen 'son_güncelleme' veya 'last_update' bilgisini ekrana yazdır
                if (data.son_güncelleme) {
                    document.getElementById('lastUpdateTime').textContent = data.son_güncelleme;
                } else if (data.last_update) {
                    document.getElementById('lastUpdateTime').textContent = data.last_update;
                }
                
                let allItems = [];
                if (data && Array.isArray(data.items)) {
                    allItems = data.items;
                } else if (data && Array.isArray(data.öğeler)) {
                    allItems = data.öğeler;
                } else if (Array.isArray(data)) {
                    allItems = data;
                }

                if (!allItems || allItems.length === 0) return;

                const container = document.getElementById('marketsContainer');
                const isFirstLoad = Object.keys(previousPrices).length === 0;

                container.innerHTML = allItems.map(item => {
                    const symbol = item.symbol || item.Sembol || 'PİYASA';
                    const price = item.price || item.fiyat || '0.00';
                    const changeStr = item.change || item.değişim || '%0.00';
                    
                    const isUp = !changeStr.includes('-');
                    const changeClass = isUp ? 'text-up' : 'text-down';
                    const iconClass = isUp ? 'fa-solid fa-caret-up' : 'fa-solid fa-caret-down';

                    let flashClass = '';
                    if (!isFirstLoad && previousPrices[symbol] !== undefined) {
                        const oldPrice = parseFloat(previousPrices[symbol]);
                        const newPrice = parseFloat(price);
                        
                        if (newPrice > oldPrice) {
                            flashClass = 'flash-green';
                        } else if (newPrice < oldPrice) {
                            flashClass = 'flash-red';
                        }
                    }
                    previousPrices[symbol] = price;

                    return `
                        <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 col-6">
                            <div class="card market-card ${flashClass}">
                                <div class="market-title">${symbol}</div>
                                <div class="market-price">${price}</div>
                                <div class="market-change ${changeClass}">
                                    <i class="${iconClass} me-1"></i>${changeStr}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error("Veri çekme hatası:", error);
            }
        }
    </script>
</body>
</html>
